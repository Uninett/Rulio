<section class="objects-table-container table-container">
    <input type="hidden" id="interface-page-ingoing-filter-ids" name="ingoing_filter_ids"
        data-interface-filter-input="in"
        value="{% for id in ingoing_filter_ids %}{{ id }}{% if not forloop.last %},{% endif %}{% endfor %}">
    <input type="hidden" id="interface-page-outgoing-filter-ids" name="outgoing_filter_ids"
        data-interface-filter-input="out"
        value="{% for id in outgoing_filter_ids %}{{ id }}{% if not forloop.last %},{% endif %}{% endfor %}">

    <table class="objects-table objects-table--interfaces">
        <thead>
            <tr>
                {% for header in filters.headers %}
                <th class="col-{{ forloop.counter }}">{{ header }}</th>
                {% endfor %}
            </tr>
        </thead>
        <tbody id="interfaces-table">
            {% for row in filters.rows %}
            {% include "partials/objects/_tableRow.html" with row=row headers=filters.headers %}
            {% empty %}
            <tr>
                <td colspan="{{ filters.headers|length }}">No filters found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</section>
{% include "partials/devices/_generateButton.html" with interface=interface %}
