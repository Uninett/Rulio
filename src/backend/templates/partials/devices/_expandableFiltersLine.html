<div class="detail-block">

    <div class="objects-interface-table objects-filters-table" data-interface-filter-list="{{ row.direction }}">
        <div class="objects-interface-table-header-row">
            {% for header in field.headers %}
            <div class="interfaces-grid__header">
                {{ header }}
            </div>
            {% endfor %}
        </div>

        {% for interface_row in field.value %}
        <div class="objects-interface-table-row" data-filter-id="{{ interface_row.id }}"
            data-filter-name="{{ interface_row.name }}" data-filter-description="{{ interface_row.description }}"
            data-filter-enabled="{{ interface_row.enabled|yesno:'true,false' }}">
            <div class="objects-interface-table-cell">{{ interface_row.sequence }}</div>
            <div class="objects-interface-table-cell">{{ interface_row.name }}</div>
            <div class="objects-interface-table-cell">{{ interface_row.description }}</div>
            <div class="objects-interface-table-cell">
                <button type="button" class="filter-enabled-toggle" role="switch"
                    aria-checked="{{ interface_row.enabled|yesno:'true,false' }}"
                    aria-label="{{ interface_row.enabled|yesno:'Enabled,Disabled' }}"
                    title="{{ interface_row.enabled|yesno:'Enabled,Disabled' }}"
                    data-enabled="{{ interface_row.enabled|yesno:'true,false' }}"
                    onclick="event.stopPropagation(); toggleInterfaceFilterEnabled('{{ row.direction }}', '{{ interface_row.id }}', this)">
                    <span class="filter-enabled-toggle-check"></span>
                </button>
            </div>
        </div>
        {% empty %}
        <div class="objects-interface-empty">
            No interfaces found.
        </div>
        {% endfor %}
    </div>
</div>
