<input type="hidden" id="initial_is_superuser" value="{{ object_data.is_superuser|default:'' }}">
<input type="hidden" id="initial_is_tenant_admin" value="{{ object_data.is_tenant_admin|default:'' }}">
<input type="hidden" id="initial_tenant_id" value="{{ object_data.tenant_id|default:'' }}">

<div class="form-row">
    <div class="form-group form-group-username">
        <label for="id_username">Username<span class="required"> *</span></label>
        <input type="text" id="id_username" name="username" value="{{ object_data.username|default:'' }}"
            autocomplete="off" required>
    </div>

    <div class="form-group form-group-checkbox">
        <div class="checkbox-control">
            <span class="checkbox-text">Superuser</span>
            <input type="checkbox" id="id_is_superuser" name="is_superuser">
        </div>
    </div>
</div>

<div class="form-group">
    <label for="id_first_name">Name</label>
    <div class="form-row">
        <input type="text" id="id_first_name" name="first_name" value="{{ object_data.first_name|default:'' }}"
            placeholder="First name">
        <input type="text" id="id_last_name" name="last_name" value="{{ object_data.last_name|default:'' }}"
            placeholder="Last name">
    </div>
</div>

<div class="form-group">
    <label for="id_email">Email</label>
    <input type="email" id="id_email" name="email" value="{{ object_data.email|default:'' }}">
</div>

{% if modal_mode == "add" %}
<div class="form-group">
    <label for="id_password">Password<span class="required"> *</span></label>
    <input type="password" id="id_password" name="password" autocomplete="new-password" required>
</div>
{% endif %}

<div class="form-row" id="tenant-access-row">
    <div class="form-group form-group-tenant" id="tenant-group">
        <label for="id_tenant_id">Tenant</label>
        <select id="id_tenant_id" name="tenant_id">
            <option value="">Select tenant</option>
            {% for tenant in tenant_options %}
            <option value="{{ tenant.id }}">
                {{ tenant.name }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group form-group-checkbox" id="tenant-admin-group">
        <div class="checkbox-control">
            <span class="checkbox-text">Tenant admin</span>
            <input type="checkbox" id="id_is_tenant_admin" name="is_tenant_admin">
        </div>
    </div>
</div>

{% if error_message %}
<div class="form-error">
    {{ error_message }}
</div>
{% endif %}

<script>
    (function () {
        const superuserCheckbox = document.getElementById("id_is_superuser");
        const tenantAccessRow = document.getElementById("tenant-access-row");
        const tenantSelect = document.getElementById("id_tenant_id");
        const tenantAdminCheckbox = document.getElementById("id_is_tenant_admin");

        const initialSuperuser = document.getElementById("initial_is_superuser");
        const initialTenantAdmin = document.getElementById("initial_is_tenant_admin");
        const initialTenantId = document.getElementById("initial_tenant_id");

        const usernameInput = document.getElementById("id_username");

        function isTruthy(value) {
            if (!value) return false;
            const normalized = value.toString().toLowerCase();
            return normalized === "true" || normalized === "1" || normalized === "on";
        }

        function normalizeUsername() {
            if (!usernameInput) return;
            usernameInput.value = usernameInput.value.toLowerCase();
        }

        function toggleTenantFields() {
            if (!superuserCheckbox || !tenantAccessRow) return;

            if (superuserCheckbox.checked) {
                tenantAccessRow.style.display = "none";
            } else {
                tenantAccessRow.style.display = "";
            }
        }

        if (superuserCheckbox && initialSuperuser) {
            superuserCheckbox.checked = isTruthy(initialSuperuser.value);
        }

        if (tenantAdminCheckbox && initialTenantAdmin) {
            tenantAdminCheckbox.checked = isTruthy(initialTenantAdmin.value);
        }

        if (tenantSelect && initialTenantId) {
            tenantSelect.value = initialTenantId.value || "";
        }

        if (usernameInput) {
            usernameInput.addEventListener("input", normalizeUsername);
            usernameInput.addEventListener("blur", normalizeUsername);
            normalizeUsername();
        }

        if (superuserCheckbox) {
            superuserCheckbox.addEventListener("change", toggleTenantFields);
        }

        toggleTenantFields();
    })();
</script>
