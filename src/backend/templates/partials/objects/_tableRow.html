{% load static %}

{% if object_type == "tags" %}
<tr id="row-{{ row.id }}"
    class="main-row tag-row {% if row.is_global %}global-row{% endif %} {% if not row.can_write %}readonly-row{% endif %}"
    style="--tag-color: {{ row.color }};" onclick="expandRow('{{ row.id }}')">
    {% else %}
<tr id="row-{{ row.id }}"
    class="main-row {% if row.is_group %}group-row{% endif %} {% if row.is_global %}global-row{% endif %} {% if not row.can_write %}readonly-row{% endif %}"
    onclick="expandRow('{{ row.id }}')">
    {% endif %}
    {% include "partials/objects/_lastCellTags.html" with row=row object_type=object_type %}

    {% if can_write_current_tenant %}
    <td class="actions-column">
        <button type="button" class="actions-btn" hx-get="{% url 'modal-update' row.id %}" hx-target="#modal-container"
            hx-swap="innerHTML" onclick="event.stopPropagation()">
            <img class="btn-icon actions-icon" src="{% static 'images/edit.svg' %}" alt="" aria-hidden="true">
        </button>
    </td>
    {% else %}
    <td class="actions-column">
        <button type="button" class="actions-btn actions-btn-disabled"
            title="{% if selected_tenant|stringformat:'s' == '1' %}Need superuser permission to update {{ object_type }}.{% else %}Need tenant admin permission to update {{ object_type }}.{% endif %}">
            <img class="btn-icon actions-icon" src="{% static 'images/actions.svg' %}" alt="" aria-hidden="true">
        </button>
    </td>
    {% endif %}
</tr>

<tr id="details-{{ row.id }}"
    class="details-row {% if row.is_global %}global-row{% endif %} {% if not row.can_write %}readonly-row{% endif %}">
    {% include "partials/objects/_expandRow.html" with row=row headers=headers %}
</tr>
