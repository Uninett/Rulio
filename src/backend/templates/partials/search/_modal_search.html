<style>
    #modalSearchInput {
        min-height: 2.5rem;
        min-width: 14rem;
        padding: 0 0.75rem;
        border: 1px solid #767676;
        border-radius: 10px;
    }

    #modalSearchDropdown {
        display: none;
        border: 1px solid #ddd;
        max-height: 240px;
        overflow-y: auto;
    }

    .modal-search-result {
        padding: 4px;
    }

    .search-result-type {
        font-size: 0.85rem;
        color: #666;
    }
</style>

<section>
    <input type="text" placeholder="Search tags..." id="modalSearchInput" onkeyup="filterModalSearch()" />

    <section id="modalSearchDropdown">
        {% for item in search_results.results %}
        <div class="modal-search-result" data-search="{{ item.search_text|default:item.name|lower }}">
            <div>{{ item.name }}</div>
            <div class="search-result-type">{{ item.type }}</div>
        </div>
        {% endfor %}
    </section>
</section>

<script>
    function filterModalSearch() {
        const input = document.getElementById("modalSearchInput");
        const filter = input.value.toUpperCase();
        const section = document.getElementById("modalSearchDropdown");
        const results = section.getElementsByClassName("modal-search-result");

        let hasMatches = false;

        if (filter.length < 2) {
            Array.from(results).forEach(result => result.style.display = "none");
            section.style.display = "none";
            return;
        }

        for (let i = 0; i < results.length; i++) {
            const searchText = (results[i].dataset.search || results[i].textContent || "").toUpperCase();

            if (searchText.indexOf(filter) > -1) {
                results[i].style.display = "";
                hasMatches = true;
            } else {
                results[i].style.display = "none";
            }
        }

        section.style.display = hasMatches ? "block" : "none";
    }
</script>
