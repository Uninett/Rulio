<section class="search-container">
    <input type="text" placeholder="Search tags..." class="search-input search-input-modal" id="modalSearchInput"
        onkeyup="filterModalSearch()" />

    <section class="search-dropdown search-dropdown-modal" id="modalSearchDropdown">
        {% for item in search_results.results %}
        <div class="search-result" data-search="{{ item.search_text|default:item.name|lower }}">
            <div class="search-result-name">{{ item.name }}</div>
            <div class="search-result-type">{{ item.type }}</div>
        </div>
        {% endfor %}
    </section>
</section>

<script>
    function filterModalSearch() {
        const input = document.getElementById("modalSearchInput");
        const filter = input.value.toUpperCase();
        const section = document.getElementById("modalSearchDropdown");
        const results = section.getElementsByClassName("search-result");

        let hasMatches = false;

        if (filter.length < 1) {
            Array.from(results).forEach(result => result.style.display = "none");
            section.style.display = "none";
            return;
        }

        for (let i = 0; i < results.length; i++) {
            const searchText = (results[i].dataset.search || results[i].textContent || "").toUpperCase();

            if (searchText.indexOf(filter) > -1) {
                results[i].style.display = "";
                hasMatches = true;
            } else {
                results[i].style.display = "none";
            }
        }

        section.style.display = hasMatches ? "block" : "none";
    }
</script>
