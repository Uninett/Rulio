<div class="form-group">
    <label for="platform">Platform<span class="required"> *</span></label>
    <input id="platform" name="platform" value="{{ object_data.platform|default:''  }}" type="text" required>
</div>

<div class="form-group">
    <label for="type">Type<span class="required"> *</span></label>
    <input id="type" name="type" value="{{ object_data.type|default:''  }}" type="text" required>
</div>

<div class="form-group">
    <label>Interfaces</label>

    {% if object_data.interfaces %}
    <p class="device-interfaces">
        {% for interface in object_data.interfaces %}
        {{ interface.name }}{% if not forloop.last %}, {% endif %}
        {% endfor %}
        ({{ object_data.interfaces|length }})
    </p>
    {% else %}
    <p class="empty-state">No interfaces are connected to this device.</p>
    {% endif %}
</div>
